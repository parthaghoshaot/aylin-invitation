<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aylin's 5th Birthday</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Welcome Screen -->
        <div id="welcome-screen" class="screen active">
            <div class="card welcome-card">
                <h1 id="welcome-heading">You're Invited!</h1>
                <p id="welcome-text">Join Aylin on a magical journey...</p>
                <button id="start-btn">Open Invitation ✨</button>
            </div>
        </div>

        <!-- Story Screen -->
        <div id="story-screen" class="screen">
            <!-- Video Section -->
            <div class="video-wrapper">
                <video id="story-video" muted playsinline></video>
                
                <!-- Final Invitation Text Overlay -->
                <div id="invitation-overlay" class="hidden">
                    <div class="invitation-panel">
                        <h2 id="invitation-title">Aylin's 5th Birthday</h2>
                        <p id="invitation-date" class="date">06 November, 2026 (Friday)</p>
                        <p id="invitation-venue" class="venue">Mankundu, Dighi Gardens</p>
                        <p id="invitation-time" class="time">11:00 am onwards</p>
                    </div>
                </div>
            </div>
            
            <!-- Bottom UI Section (Mobile Optimised) -->
            <div class="bottom-ui">
                <div class="story-narrative card">
                    <p id="narrative-text"></p>
                </div>
                
                <div class="controls">
                    <button id="prev-btn" class="secondary-btn hidden">🔙 Back</button>
                    <button id="next-btn" class="hidden"></button>
                </div>
            </div>
        </div>
    </div>

    <audio id="scene-audio"></audio>
    <script src="script.js"></script>
</body>
</html>
